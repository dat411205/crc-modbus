<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tính CRC Modbus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a4d8f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRC Modbus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f3f6fa;--card:#fff;--tx:#1b2430;--mut:#667085;--pri:#1a4d8f;--bd:#d5dde8;--err:#c0392b;--ok:#2e7d32;--hl:#e8f1fb;--one:#fff6e0}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#1a212b;--tx:#e8edf3;--mut:#9aa6b6;--pri:#5b9bf0;--bd:#2c3644;--err:#ff7b6b;--ok:#6fcf7a;--hl:#1d2c40;--one:#3a2f14}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 14px);max-width:640px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px;color:var(--pri)}
label.t{display:block;font-weight:600;margin:14px 0 6px}
textarea{width:100%;font:17px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);resize:vertical;text-transform:uppercase}
textarea:focus{outline:2px solid var(--pri)}
.hint{color:var(--mut);font-size:13px;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stat small{display:block;color:var(--mut);font-size:12px}
.stat b{font:700 18px ui-monospace,Menlo,Consolas,monospace}
.err{color:var(--err);min-height:20px;margin-top:8px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{font-weight:600;font-size:16px;font-family:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--pri);color:#fff}
button.sec{background:var(--card);color:var(--pri);border:1px solid var(--bd)}
button.grow{flex:1}
button:active{opacity:.7}
#out{font-weight:700;background:var(--hl)}
.ok{color:var(--ok);min-height:20px;margin-top:8px;font-size:14px}
/* guide */
#guide{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10;
 padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#guide.open{display:flex}
.gh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bd)}
.gh b{color:var(--pri)}
.tabs{display:flex;gap:6px;padding:8px 14px}
.tabs button{flex:1;padding:9px}
.tabs button.on{background:var(--pri);color:#fff}
.gb{overflow:auto;padding:4px 14px 24px;flex:1;-webkit-overflow-scrolling:touch}
.gb h3{color:var(--pri);margin:18px 0 4px;font-size:16px}
.gb p{margin:0;white-space:pre-wrap;line-height:1.5;font-size:15px}
table{border-collapse:collapse;width:100%;font:13px ui-monospace,Menlo,Consolas,monospace;margin-top:8px}
th,td{border:1px solid var(--bd);padding:5px 4px;text-align:center}
th{background:var(--card);position:sticky;top:0}
tr.x td{background:var(--hl);font-weight:700}
tr.o td{background:var(--one)}
.sum{font:700 14px ui-monospace,Menlo,Consolas,monospace;margin:8px 0;line-height:1.5}
</style>
</head>
<body>
<h1>Tính CRC-16 Modbus RTU</h1>

<label class="t" for="in">Nhập các byte truyền đi (HEX, chưa gồm CRC)</label>
<textarea id="in" rows="4" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="01 06 00 01 03 00"></textarea>
<div class="hint">Ví dụ: 01 06 00 01 03 00 &nbsp;(hoặc 010600010300)</div>

<div class="stats">
  <div class="stat"><small>Số byte</small><b id="cnt">0</b></div>
  <div class="stat"><small>CRC</small><b id="crc">--</b></div>
  <div class="stat"><small>CRC gửi (Low→High)</small><b id="snd">--</b></div>
</div>
<div class="err" id="err"></div>

<div class="row">
  <button class="grow" id="exp">Xuất khung hoàn chỉnh</button>
  <button class="sec" id="clr">Xóa</button>
</div>

<label class="t" for="out">Khung truyền hoàn chỉnh (dữ liệu + CRC)</label>
<textarea id="out" rows="3" readonly></textarea>
<div class="row">
  <button class="sec grow" id="cpy">Sao chép</button>
  <button class="sec grow" id="gd">Hướng dẫn tính CRC bằng tay</button>
</div>
<div class="ok" id="ok"></div>

<div id="guide">
  <div class="gh"><b>Hướng dẫn tính CRC-16/MODBUS</b><button class="sec" id="gx">Đóng</button></div>
  <div class="tabs"><button id="t1" class="on">Nguyên lý</button><button id="t2" class="sec">Tính từng bước</button></div>
  <div class="gb" id="gb"></div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);

function crc16(d){let c=0xFFFF;for(const b of d){c^=b;for(let i=0;i<8;i++){c=(c&1)?((c>>1)^0xA001):(c>>1);}}return c;}
const H2=n=>n.toString(16).toUpperCase().padStart(2,"0");
const H4=n=>n.toString(16).toUpperCase().padStart(4,"0");
const fmt=a=>a.map(H2).join(" ");

function parseHex(t){
  t=t.replace(/0x/gi," ");
  const toks=t.split(/[\s,;:\-]+/).filter(Boolean),out=[];
  for(let tok of toks){
    if(!/^[0-9A-Fa-f]+$/.test(tok)) throw new Error("Ký tự không hợp lệ: '"+tok+"' (chỉ dùng 0-9, A-F)");
    if(tok.length===1) tok="0"+tok;
    if(tok.length%2) throw new Error("'"+tok+"' có số ký tự lẻ, hãy tách thành từng byte 2 ký tự");
    for(let i=0;i<tok.length;i+=2) out.push(parseInt(tok.substr(i,2),16));
  }
  return out;
}

function trace(d){
  const rows=[];let c=0xFFFF;
  for(const b of d){
    const n=c^b;rows.push({k:"x",v:[H2(b),"XOR",H4(c),"","","",H4(n)]});c=n;
    for(let i=1;i<=8;i++){
      const bit=c&1,s=c>>1,a=bit?(s^0xA001):s;
      rows.push({k:bit?"o":"",v:["","V"+i,H4(c),bit,H4(s),bit?"Có":"Không",H4(a)]});c=a;
    }
  }
  return {rows,crc:c};
}

function live(){
  $("ok").textContent="";
  try{
    const d=parseHex($("in").value);
    $("err").textContent="";$("cnt").textContent=d.length;
    if(!d.length){$("crc").textContent="--";$("snd").textContent="--";return d;}
    const c=crc16(d);
    $("crc").textContent=H4(c);$("snd").textContent=H2(c&255)+" "+H2(c>>8);
    return d;
  }catch(e){
    $("err").textContent=e.message;$("cnt").textContent="?";$("crc").textContent="--";$("snd").textContent="--";
    return null;
  }
}

async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){}
  const o=$("out");o.removeAttribute("readonly");o.select();o.setSelectionRange(0,9999);
  let ok=false;try{ok=document.execCommand("copy");}catch(e){}
  o.setAttribute("readonly","");return ok;
}

$("in").addEventListener("input",live);
$("exp").onclick=async()=>{
  const d=live();
  if(d===null) return;
  if(!d.length){$("err").textContent="Hãy nhập ít nhất 1 byte.";return;}
  const c=crc16(d),f=d.concat([c&255,c>>8]);
  $("out").value=fmt(f);
  const ok=await copyText($("out").value);
  $("ok").textContent="Đã xuất "+f.length+" byte ("+d.length+" dữ liệu + 2 CRC)"+(ok?" và sao chép vào clipboard.":".");
};
$("cpy").onclick=async()=>{
  if(!$("out").value) return;
  $("ok").textContent=(await copyText($("out").value))?"Đã sao chép khung.":"Không sao chép được, hãy giữ ngón tay vào khung để chép.";
};
$("clr").onclick=()=>{$("in").value="";$("out").value="";live();$("in").focus();};

/* ---------- Hướng dẫn ---------- */
const G=[
["1. CRC là gì?","CRC (Cyclic Redundancy Check) là mã kiểm tra lỗi đặt ở cuối khung dữ liệu. Trong Modbus RTU, CRC-16/MODBUS dùng để kiểm tra các byte nhận được có bị sai khi truyền hay không.\n• CRC được tính từ TẤT CẢ các byte đứng trước nó trong frame.\n• Đổi Slave ID, Function Code, địa chỉ hoặc dữ liệu thì phải tính lại CRC.\n• Khi truyền, 2 byte CRC được gửi Low byte trước, High byte sau."],
["2. Thông số CRC-16/MODBUS","• CRC ban đầu: FFFF (HEX)\n• Polynomial: A001 (HEX)\n• Xử lý bit: LSB-first (dịch phải)\n• Số vòng cho mỗi byte: 8 vòng\n• Final XOR: 0000 (không XOR thêm)\n• Thứ tự truyền CRC: Low byte trước, High byte sau"],
["3. Phép XOR","XOR làm trên từng bit: khác nhau → 1; giống nhau → 0.\n0 XOR 0 = 0   0 XOR 1 = 1   1 XOR 0 = 1   1 XOR 1 = 0\n\nVí dụ 4 bit:  1010 XOR 1100 = 0110\nVí dụ HEX:    FF00 XOR 00FF = FFFF\nXOR không phải phép cộng thông thường."],
["4. \"Bit cuối\" là bit nào?","Là bit 0 (LSB) của thanh ghi CRC 16-bit HIỆN TẠI, KHÔNG phải bit cuối của byte dữ liệu.\nCRC = FFFE = 1111 1111 1111 1110 → bit 0 = 0\nCRC = 7FFF = 0111 1111 1111 1111 → bit 0 = 1\nSau khi XOR byte dữ liệu vào CRC, nhìn bit 0 của CRC mới để quyết định bước tiếp theo."],
["5. Thuật toán bằng tay","1) Khởi tạo CRC = FFFF (chỉ 1 lần ở đầu frame).\n2) Lấy 1 byte dữ liệu, XOR vào CRC.\n3) Lặp đúng 8 lần cho byte đó:\n   - bit 0 của CRC = 0: CRC = CRC >> 1\n   - bit 0 của CRC = 1: CRC = (CRC >> 1) XOR A001\n4) Sang byte kế tiếp, KHÔNG reset CRC.\n5) Hết byte, CRC 16-bit là kết quả. Đổi thứ tự 2 byte để gửi Low byte trước.\n(\">> 1\" là dịch cả số sang phải 1 bit, bit 0 bị bỏ, chèn 0 vào bên trái.)"],
["6. Ví dụ: 01 06 00 01 03 00","Sau khi xử lý 6 byte, CRC = FAD8.\nTách byte: FA và D8. Modbus RTU gửi Low byte trước → gửi D8 rồi FA.\nKhung hoàn chỉnh: 01 06 00 01 03 00 D8 FA\n\nSang tab \"Tính từng bước\" để xem 8 vòng của từng byte với dữ liệu bạn đang nhập."],
["7. Lỗi thường gặp","• Kiểm tra nhầm bit: phải là bit 0 của thanh ghi CRC, không phải của byte dữ liệu.\n• Reset CRC sau mỗi byte: SAI, chỉ khởi tạo FFFF một lần.\n• Quên XOR A001 khi bit 0 = 1.\n• Dịch sai hướng: phải dịch phải (>> 1).\n• Tính CRC luôn cả 2 byte CRC cũ: SAI, chỉ tính phần dữ liệu trước CRC.\n• Gửi FA D8 thay vì D8 FA: SAI thứ tự byte.\n• Dùng CRC cũ cho lệnh mới: đổi 1 byte là phải tính lại từ đầu."]
];
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function tabTheory(){
  $("gb").innerHTML=G.map(([h,b])=>"<h3>"+esc(h)+"</h3><p>"+esc(b)+"</p>").join("");
}
function tabSteps(){
  let d;try{d=parseHex($("in").value);}catch(e){d=[];}
  let ex=false;if(!d.length){d=[1,6,0,1,3,0];ex=true;}
  const {rows,crc}=trace(d);
  let h='<div class="sum">'+(ex?"Dữ liệu ví dụ: ":"Dữ liệu đang nhập: ")+fmt(d)+
    "<br>CRC bắt đầu FFFF → kết thúc "+H4(crc)+"<br>Gửi: "+H2(crc&255)+" "+H2(crc>>8)+" (Low trước, High sau)</div>";
  h+="<table><tr><th>Byte</th><th>Bước</th><th>CRC trước</th><th>Bit0</th><th>Sau &gt;&gt;1</th><th>XOR A001</th><th>CRC sau</th></tr>";
  for(const r of rows) h+='<tr class="'+r.k+'">'+r.v.map(x=>"<td>"+x+"</td>").join("")+"</tr>";
  h+='</table><p class="hint">Dòng xanh: XOR byte vào CRC. Dòng vàng: bit 0 = 1 nên phải XOR A001. V1…V8 là 8 vòng.</p>';
  $("gb").innerHTML=h;
}
function setTab(n){
  $("t1").className=n===1?"on":"sec";$("t2").className=n===2?"on":"sec";
  n===1?tabTheory():tabSteps();$("gb").scrollTop=0;
}
$("gd").onclick=()=>{$("guide").classList.add("open");setTab(1);};
$("gx").onclick=()=>$("guide").classList.remove("open");
$("t1").onclick=()=>setTab(1);$("t2").onclick=()=>setTab(2);

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
